	<script>
function displayMedia(mediaUrl, button) {
  // Find the closest target container
  const container = button.closest('.targetContainer');

  // Find the image and video inside that container
  const imgElement = container.querySelector('.targetImage');
  const videoElement = container.querySelector('.targetVideo');

  // Check if the file URL ends with .mp4
  if (mediaUrl.toLowerCase().endsWith('.mp4')) {

    // Hide image, show video
    imgElement.style.display = "none";
    videoElement.style.display = "block";

    // Load and play video
    videoElement.src = mediaUrl;
    videoElement.load();
    videoElement.play();

  } else {

    // Pause video
    videoElement.pause();

    // Hide video, show image
    videoElement.style.display = "none";
    imgElement.style.display = "block";

    // Change image
    imgElement.src = mediaUrl;
  }
}
</script>
